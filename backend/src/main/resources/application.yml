server:
  port: 8080

spring:
  application:
    name: tsingtaohui-backend
  datasource:
    url: jdbc:mysql://localhost:3306/tsingtaohui?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      table-prefix: t_
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

tsingtaohui:
  jwt:
    secret: ${JWT_SECRET:tsingtaohui-default-secret-key-must-be-replaced-in-production}
    access-token-expiration: 7200000
    refresh-token-expiration: 604800000
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000

logging:
  level:
    com.tsingtaohui: DEBUG
    org.springframework.security: DEBUG
